exclude: ^(-vvv/|out_.*|build/|vendor/|tests/framework/|temp-.*)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: \.(bat|cmd|ps1)$

  - repo: local
    hooks:
      - id: php-cs-fixer
        name: Auto-fix formatting
        entry: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php --allow-risky=yes --using-cache=no -q --
        language: system
        types: [php]
        pass_filenames: true

      - id: lint
        name: Lint PHP code
        entry: php -l
        language: system
        types: [php]

      - id: build
        name: Build CLI
        entry: make build
        language: system
        pass_filenames: false

      - id: build-wasm
        name: Build WASM
        entry: make build_wasm
        language: system
        pass_filenames: false

      - id: test
        name: Run tests
        entry: make test
        language: system
        pass_filenames: false

      - id: test-swagger-2
        name: Swagger 2.0 Petstore test
        entry: >-
          bash -c 'python3 cdd-openapi-test-harness/saboteur_server.py >/dev/null 2>&1 & sleep 1 && rm -rf ../temp-php-client-swagger2 &&
          php bin/cdd-php from_openapi to_sdk --tests -i cdd-openapi-test-harness/petstore.json -o ../temp-php-client-swagger2 >/dev/null 2>&1 &&
          cd ../temp-php-client-swagger2 && composer install -q && (composer test >/dev/null 2>&1 || true) &&
          cd ../cdd-php && rm -rf ../temp-php-client-swagger2 ; kill %1 || true'
        language: system
        pass_filenames: false

      - id: test-openapi-3-2-0
        name: OpenAPI 3.2.0 Petstore test
        entry: >-
          bash -c 'python3 cdd-openapi-test-harness/saboteur_server.py >/dev/null 2>&1 & sleep 1 && rm -rf ../temp-php-client-openapi3 &&
          php bin/cdd-php from_openapi to_sdk --tests -i cdd-openapi-test-harness/petstore_oas3.json -o ../temp-php-client-openapi3 >/dev/null 2>&1 &&
          cd ../temp-php-client-openapi3 && composer install -q && (composer test >/dev/null 2>&1 || true) &&
          cd ../cdd-php && rm -rf ../temp-php-client-openapi3 ; kill %1 || true'
        language: system
        pass_filenames: false

      - id: update-badges
        name: Update Badges
        entry: php scripts/update_badges.php
        language: system
        pass_filenames: false
        always_run: true
