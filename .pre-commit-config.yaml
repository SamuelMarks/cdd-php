exclude: ^(-vvv/|out_.*|build/|vendor/|tests/framework/|temp-.*)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: \.(bat|cmd|ps1)$

  - repo: local
    hooks:
      - id: php-cs-fixer
        name: Auto-fix formatting
        entry: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php --allow-risky=yes --using-cache=no -q --
        language: system
        types: [php]
        pass_filenames: true

      - id: lint
        name: Lint PHP code
        entry: php -l
        language: system
        types: [php]

      - id: build
        name: Build CLI
        entry: make build
        language: system
        pass_filenames: false

      - id: build-wasm
        name: Build WASM
        entry: make build_wasm
        language: system
        pass_filenames: false

      - id: test
        name: Run tests
        entry: make test
        language: system
        pass_filenames: false

      - id: test-swagger-2
        name: Swagger 2.0 Petstore test
        entry: >-
          bash -c '
          if command -v docker >/dev/null 2>&1; then
            docker rm -f petstore_swagger_2 >/dev/null 2>&1 || true;
            docker run -d -p 8080:8080 -e SWAGGER_HOST="http://localhost:8080" -e SWAGGER_BASE_PATH="/v2" --name petstore_swagger_2 swaggerapi/petstore >/dev/null 2>&1 || docker run -d -p 8080:8080 --name petstore_swagger_2 swaggerapi/swagger-petstore-node >/dev/null 2>&1;
            sleep 5;
          fi;
          rm -rf temp-php-client-swagger2 &&
          php bin/cdd-php from_openapi to_sdk --tests -i cdd-openapi-test-harness/petstore.json -o temp-php-client-swagger2 >/dev/null 2>&1 &&
          cd temp-php-client-swagger2 && composer install -q && composer test >/dev/null 2>&1 &&
          cd .. && rm -rf temp-php-client-swagger2 ;
          if command -v docker >/dev/null 2>&1; then docker rm -f petstore_swagger_2 >/dev/null 2>&1 || true; fi
          '
        language: system
        pass_filenames: false

      - id: test-openapi-3-2-0
        name: OpenAPI 3.2.0 Petstore test
        entry: >-
          bash -c '
          if command -v docker >/dev/null 2>&1; then
            docker rm -f petstore_openapi_3 >/dev/null 2>&1 || true;
            docker run -d -p 8080:8080 -e SWAGGER_HOST="http://localhost:8080" -e SWAGGER_BASE_PATH="/api/v3" --name petstore_openapi_3 swaggerapi/petstore >/dev/null 2>&1 || docker run -d -p 8080:8080 --name petstore_openapi_3 swaggerapi/swagger-petstore-node >/dev/null 2>&1;
            sleep 5;
          fi;
          rm -rf temp-php-client-openapi3 &&
          php bin/cdd-php from_openapi to_sdk --tests -i cdd-openapi-test-harness/petstore_oas3.json -o temp-php-client-openapi3 >/dev/null 2>&1 &&
          cd temp-php-client-openapi3 && composer install -q && composer test >/dev/null 2>&1 &&
          cd .. && rm -rf temp-php-client-openapi3 ;
          if command -v docker >/dev/null 2>&1; then docker rm -f petstore_openapi_3 >/dev/null 2>&1 || true; fi
          '
        language: system
        pass_filenames: false

      - id: test-php-server-swagger2
        name: PHP Server Swagger 2.0 test
        entry: >-
          bash -c '
          rm -rf temp-php-server-swagger2 temp-php-client-swagger2-php &&
          php bin/cdd-php from_openapi to_server -i cdd-openapi-test-harness/petstore.json -o temp-php-server-swagger2 >/dev/null 2>&1 &&
          php bin/cdd-php from_openapi to_sdk --tests -i cdd-openapi-test-harness/petstore.json -o temp-php-client-swagger2-php >/dev/null 2>&1 &&
          cd temp-php-server-swagger2 && composer install -q || exit 1;
          php -S localhost:8080 server.php >/dev/null 2>&1 &
          SERVER_PID=$! ;
          sleep 2 &&
          cd ../temp-php-client-swagger2-php && composer install -q && composer test >/dev/null 2>&1;
          TEST_EXIT_CODE=$? ;
          kill $SERVER_PID >/dev/null 2>&1 || true;
          cd .. && rm -rf temp-php-server-swagger2 temp-php-client-swagger2-php;
          exit $TEST_EXIT_CODE
          '
        language: system
        pass_filenames: false

      - id: test-php-server-openapi-3
        name: PHP Server OpenAPI 3.2.0 test
        entry: >-
          bash -c '
          rm -rf temp-php-server-openapi3 temp-php-client-openapi3-php &&
          php bin/cdd-php from_openapi to_server -i cdd-openapi-test-harness/petstore_oas3.json -o temp-php-server-openapi3 >/dev/null 2>&1 &&
          php bin/cdd-php from_openapi to_sdk --tests -i cdd-openapi-test-harness/petstore_oas3.json -o temp-php-client-openapi3-php >/dev/null 2>&1 &&
          cd temp-php-server-openapi3 && composer install -q || exit 1;
          php -S localhost:8080 server.php >/dev/null 2>&1 &
          SERVER_PID=$! ;
          sleep 2 &&
          cd ../temp-php-client-openapi3-php && composer install -q && composer test >/dev/null 2>&1;
          TEST_EXIT_CODE=$? ;
          kill $SERVER_PID >/dev/null 2>&1 || true;
          cd .. && rm -rf temp-php-server-openapi3 temp-php-client-openapi3-php;
          exit $TEST_EXIT_CODE
          '
        language: system
        pass_filenames: false

      - id: update-badges
        name: Update Badges
        entry: php scripts/update_badges.php
        language: system
        pass_filenames: false
        always_run: true
