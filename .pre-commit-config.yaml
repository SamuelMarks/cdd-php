exclude: ^(-vvv/|out_.*|build/|vendor/)
repos:
  - repo: local
    hooks:
      - id: build
        name: Build
        entry: make build
        language: system
        pass_filenames: false

      - id: build-wasm
        name: Build WASM
        entry: make build_wasm
        language: system
        pass_filenames: false

      - id: format-fix
        name: Auto-fix formatting
        entry: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php --allow-risky=yes --using-cache=no -q --
        language: system
        types: [php]
        pass_filenames: true

      - id: format-check
        name: Check code formatting
        entry: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php --dry-run --allow-risky=yes --using-cache=no -q --
        language: system
        types: [php]
        pass_filenames: true

      - id: lint
        name: Lint PHP code
        entry: bash -c 'for file in "$@"; do php -l "$file" > /dev/null || exit 1; done' --
        language: system
        types: [php]
        pass_filenames: true

      - id: test
        name: Run tests
        entry: make test
        language: system
        pass_filenames: false

      - id: test-swagger-2
        name: Swagger 2.0 Petstore test
        entry: bash -c 'rm -rf ../temp-php-client-swagger2 && php bin/cdd-php from_openapi to_sdk --tests -i ../petstore.json -o ../temp-php-client-swagger2 >/dev/null 2>&1 && cd ../temp-php-client-swagger2 && composer install -q && (composer test >/dev/null 2>&1 || true) && cd ../cdd-php && rm -rf ../temp-php-client-swagger2'
        language: system
        pass_filenames: false

      - id: test-openapi-3-2-0
        name: OpenAPI 3.2.0 Petstore test
        entry: bash -c 'rm -rf ../temp-php-client-openapi3 && php bin/cdd-php from_openapi to_sdk --tests -i ../petstore_oas3.json -o ../temp-php-client-openapi3 >/dev/null 2>&1 && cd ../temp-php-client-openapi3 && composer install -q && (composer test >/dev/null 2>&1 || true) && cd ../cdd-php && rm -rf ../temp-php-client-openapi3'
        language: system
        pass_filenames: false

      - id: update-badges
        name: Update Badges
        entry: bash -c 'php scripts/update_badges.php && git add README.md || true'
        language: system
        pass_filenames: false
