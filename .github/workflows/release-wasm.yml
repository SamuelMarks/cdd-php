name: Release WASM

on:
  push:
    tags:
      - '0.0.1'
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Build WASM
        run: |
          make install_deps
          make build_wasm
          cp build/wasm/cdd-php.wasm .
      - name: Release WASM Artifact
        uses: softprops/action-gh-release@v2
        with:
          files: cdd-php.wasm
