name: CI
on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Checkout parent repo for test schemas
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/cdd-openapi-test-harness
        path: cdd-openapi-test-harness
    - name: Use PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        coverage: phpdbg
    - name: Install Dependencies
      run: composer install

    - name: Build
      run: make build

    - name: Lint PHP code
      run: find src tests bin scripts -name "*.php" -exec php -l {} \; > /dev/null

    - name: Check code formatting
      run: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php --dry-run --allow-risky=yes --using-cache=no -q

    - name: Run tests (with coverage)
      run: make test

    - name: Verify Coverage Badges (Optional - Fails if badges need update)
      run: |
        php scripts/update_badges.php
        git diff --exit-code README.md || (echo "README.md badges are out of date! Please run 'php scripts/update_badges.php' locally and commit the result." && exit 1)

    - name: PHP Server Swagger 2.0 test
      run: |
        mkdir -p temp-php-server-swagger2
        php bin/cdd-php from_openapi to_server -i cdd-openapi-test-harness/petstore.json -o temp-php-server-swagger2
        cd temp-php-server-swagger2
        composer install -q
        php -S 127.0.0.1:8080 server.php &
        SERVER_PID=$!
        sleep 2
        cd ..
        mkdir -p temp-php-client-swagger2-php
        php bin/cdd-php from_openapi to_sdk --tests -i cdd-openapi-test-harness/petstore.json -o temp-php-client-swagger2-php
        cd temp-php-client-swagger2-php
        composer install -q
        composer test
        kill $SERVER_PID || true

    - name: PHP Server OpenAPI 3.2.0 test
      run: |
        mkdir -p temp-php-server-openapi3
        php bin/cdd-php from_openapi to_server -i cdd-openapi-test-harness/petstore_oas3.json -o temp-php-server-openapi3
        cd temp-php-server-openapi3
        composer install -q
        php -S 127.0.0.1:8080 server.php &
        SERVER_PID=$!
        sleep 2
        cd ..
        mkdir -p temp-php-client-openapi3-php
        php bin/cdd-php from_openapi to_sdk --tests -i cdd-openapi-test-harness/petstore_oas3.json -o temp-php-client-openapi3-php
        cd temp-php-client-openapi3-php
        composer install -q
        composer test
        kill $SERVER_PID || true

  test_petstore_mock:
    runs-on: ubuntu-latest
    services:
      petstore:
        image: swaggerapi/petstore
        ports:
          - 8080:8080
        env:
          SWAGGER_HOST: "http://127.0.0.1:8080"
    steps:
    - uses: actions/checkout@v7
    - name: Checkout parent repo for test schemas
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/cdd-openapi-test-harness
        path: cdd-openapi-test-harness
    - name: Use PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
    - name: Install Dependencies
      run: composer install
    - name: Build
      run: make build

    - name: Start Petstore Server (Swagger 2.0)
      run: ./scripts/start_mock_server.sh

    - name: Swagger 2.0 Petstore test
      run: |
        mkdir -p temp-php-client-swagger2
        php bin/cdd-php from_openapi to_sdk --tests -i cdd-openapi-test-harness/petstore.json -o temp-php-client-swagger2
        cd temp-php-client-swagger2
        composer install -q
        composer test

    - name: Start Petstore Server (OpenAPI 3)
      run: ./scripts/start_mock_server.sh

    - name: OpenAPI 3.2.0 Petstore test
      run: |
        mkdir -p temp-php-client-openapi3
        php bin/cdd-php from_openapi to_sdk --tests -i cdd-openapi-test-harness/petstore_oas3.json -o temp-php-client-openapi3
        cd temp-php-client-openapi3
        composer install -q
        composer test

  build_wasm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
    - run: composer install
    - name: Build WASM
      run: |
        make build_wasm
    - name: Upload WASM
      uses: actions/upload-artifact@v7
      with:
        name: wasm-build
        path: build/wasm/*.wasm
      continue-on-error: true

  release:
    needs: [test, test_petstore_mock, build_wasm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Use PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
    - run: composer install
    - run: make build
    - name: Download WASM artifact
      uses: actions/download-artifact@v8
      with:
        name: wasm-build
        path: build/wasm-download/
      continue-on-error: true
    - name: Flatten Artifacts
      run: |
        find build/wasm-download -name "*.wasm" -exec cp {} build/ \; || true
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        make_latest: true
        files: |
          build/cdd-php
          build/cdd-php.wasm
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Update latest tag
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git tag -f latest
        git push origin -f latest
    - name: Create Latest Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: latest
        name: Release latest
        draft: false
        make_latest: false
        files: |
          build/cdd-php
          build/cdd-php.wasm
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
